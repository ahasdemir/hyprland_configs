# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify "uwsm-app -- /home/ahmet/.local/bin/spotify-omarchy"
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com/app"
bindd = SUPER SHIFT ALT, A, ChatGPT (private), exec, omarchy-launch-browser --private "https://chatgpt.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/u/0/r?pli=1"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.google.com/mail/u/0/"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"

# AI Grammar Fixer & Text Enhancer (Gemini)
bindd = CTRL, SPACE, AI Grammar Fixer (Gemini), exec, ~/.config/hypr/scripts/ai-grammar.sh fix
bindd = CTRL ALT, SPACE, AI Text Enhancer (Gemini), exec, ~/.config/hypr/scripts/ai-grammar.sh enhance
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"


# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys / Pebble Keys
bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
unbind = , F9
bindd = , F9, Toggle dictation, exec, voxtype record toggle
# bindd = SUPER, PERIOD, Emoji picker, exec, omarchy-launch-walker -m symbols # Emoji Button
# bindd = , F8, Emoji picker, exec, omarchy-launch-walker -m symbols # F8 Key
bindld = , XF86EmojiPicker, Emoji picker, exec, omarchy-launch-walker -m symbols
bindld = , XF86Favorites, Emoji picker, exec, omarchy-launch-walker -m symbols
bindd = SUPER CTRL ALT SHIFT, SPACE, Emoji picker, exec, omarchy-launch-walker -m symbols



# SwayOSD bindings
# bindld = , Caps_Lock, Caps Lock, exec, omarchy-swayosd-client --caps-lock

# Logitech M720 Gesture Button (Switch monitor focus)
bind = , mouse:278, focusmonitor, +1

# Clipboard manager rebinding
unbind = SUPER CTRL, V
bindd = SUPER SHIFT, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard

# Force-kill active window instantly (ideal for frozen Wine/OnlyOffice apps)
bindd = SUPER SHIFT, W, Force kill active window, exec, hyprctl activewindow -j | jq -r ".pid" | xargs kill -9
