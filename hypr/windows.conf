# Application Workspace Assignments using Hyprland 0.53+ syntax

# Obsidian -> Workspace 3
windowrule = workspace 3, match:class ^obsidian$

# Spotify -> Workspace 5
windowrule = workspace 5, match:class ^Spotify$
windowrule = workspace 5, match:class ^spotify$

# Psysonic -> Workspace 5
windowrule = workspace 5, match:class ^Psysonic$
windowrule = workspace 5, match:class ^psysonic$

# Chromium -> Workspace 2
windowrule = workspace 2, match:class ^chromium$
windowrule = workspace 2, match:class ^Chromium-browser$
windowrule = workspace 2, match:class ^helium-browser$
windowrule = workspace 2, match:class ^Helium-browser$

# Helium transparency rules (active: 0.95, inactive: 0.90)
windowrule = opacity 0.95 override 0.90 override, match:class ^[hH]elium(-browser)?$

# YouTube PWA -> Workspace 1
windowrule = workspace 1, match:class ^chrome-youtube.com__-Default$

# WhatsApp -> Workspace 4
windowrule = workspace 4, match:class ^chrome-web.whatsapp.com__-Default$
windowrule = workspace 4, match:class ^whatsapp-for-linux$
windowrule = workspace 4, match:class ^whatsapp$

# Discord -> Workspace 4
windowrule = workspace 4, match:class ^[Dd]iscord.*$
windowrule = workspace 4, match:class ^chrome-.*discord.com.*$


# Layer rules for Waybar (fixes menu layering and transparency)

# Float Nautilus
windowrule = tag +floating-window, match:class ^org.gnome.Nautilus$

# Force Rocket League to open on DP-1 (1080p monitor)
windowrule = monitor DP-1, match:class ^[Rr]ocket[Ll]eague.*

# Gaming Rules: Enable low-latency immediate mode (tearing) for games
windowrule = immediate on, match:class ^[Rr]ocket[Ll]eague.*
windowrule = immediate on, match:class ^steam_app_.*

